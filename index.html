<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naattukootam - Local Directory & Marketplace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        royal: {
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#172554'
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom smooth transitions and scrollbar */
        * {
            scrollbar-width: thin;
            scrollbar-color: #cbd5e1 #f1f5f9;
        }
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-full flex flex-col antialiased">

    <!-- Header / Navbar -->
    <header class="bg-gradient-to-r from-royal-900 via-royal-800 to-emerald-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-white p-2.5 rounded-xl shadow-md flex items-center justify-center">
                    <i class="fa-solid fa-city text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold tracking-tight">നാട്ടുകൂട്ടം (Naattukootam)</h1>
                    <p class="text-xs text-emerald-300 font-medium">Local Directory & Marketplace</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="openAddModal()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-medium text-sm px-4 py-2 rounded-xl shadow transition transform active:scale-95 flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">Add Listing</span>
                </button>
            </div>
        </div>
        
        <!-- Tab Navigation Bar -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex space-x-4 border-t border-royal-700/50">
            <button onclick="switchTab('directory')" id="btn-directory" class="py-3 px-4 text-sm font-semibold border-b-2 border-emerald-400 text-white flex items-center space-x-2 transition">
                <i class="fa-solid fa-address-book"></i>
                <span>Local Directory</span>
            </button>
            <button onclick="switchTab('marketplace')" id="btn-marketplace" class="py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-300 hover:text-white flex items-center space-x-2 transition">
                <i class="fa-solid fa-store"></i>
                <span>Marketplace / Classifieds</span>
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 overflow-y-auto">

        <!-- DIRECTORY SECTION -->
        <section id="section-directory" class="space-y-6">
            <!-- Search & Filter Bar -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="directory-search" oninput="filterDirectory()" placeholder="Search shops, doctors, services..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-royal-600 transition">
                </div>
                <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                    <button onclick="filterDirCategory('all')" id="dir-cat-all" class="dir-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-royal-900 text-white whitespace-nowrap transition">All</button>
                    <button onclick="filterDirCategory('Shop')" id="dir-cat-Shop" class="dir-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Shops</button>
                    <button onclick="filterDirCategory('Doctor')" id="dir-cat-Doctor" class="dir-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Doctors</button>
                    <button onclick="filterDirCategory('Hospital')" id="dir-cat-Hospital" class="dir-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Hospitals</button>
                    <button onclick="filterDirCategory('Service')" id="dir-cat-Service" class="dir-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Services</button>
                </div>
            </div>

            <!-- Directory Grid -->
            <div id="directory-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dynamically populated -->
            </div>
        </section>

        <!-- MARKETPLACE SECTION -->
        <section id="section-marketplace" class="space-y-6 hidden">
            <!-- Search & Filter Bar -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search"></i>
                    </span>
                    <input type="text" id="market-search" oninput="filterMarketplace()" placeholder="Search items e.g., chicken, banana, tools..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600 transition">
                </div>
                <div class="flex items-center gap-2 w-full md:w-auto overflow-x-auto pb-1 md:pb-0">
                    <button onclick="filterMarketCategory('all')" id="market-cat-all" class="market-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-emerald-700 text-white whitespace-nowrap transition">All</button>
                    <button onclick="filterMarketCategory('Livestock & Food')" id="market-cat-Livestock" class="market-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Food & Produce</button>
                    <button onclick="filterMarketCategory('Appliances')" id="market-cat-Appliances" class="market-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Appliances</button>
                    <button onclick="filterMarketCategory('Vehicles')" id="market-cat-Vehicles" class="market-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Vehicles</button>
                    <button onclick="filterMarketCategory('Others')" id="market-cat-Others" class="market-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition">Others</button>
                </div>
            </div>

            <!-- Marketplace Grid -->
            <div id="marketplace-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dynamically populated -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
            Naattukootam Local Directory & Classifieds &bull; Powered by SNEC Premium Capsule Design
        </div>
    </footer>

    <!-- ADD LISTING MODAL -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl shadow-2xl max-w-lg w-full overflow-hidden border border-slate-100 animate-in fade-in zoom-in duration-200">
            <div class="bg-gradient-to-r from-royal-900 to-emerald-900 px-6 py-4 text-white flex justify-between items-center">
                <h3 class="font-bold text-lg flex items-center space-x-2">
                    <i class="fa-solid fa-circle-plus text-emerald-400"></i>
                    <span>Add New Listing</span>
                </h3>
                <button onclick="closeAddModal()" class="text-slate-300 hover:text-white p-1 rounded-lg transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="add-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-4 max-h-[80vh] overflow-y-auto">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Listing Type</label>
                    <select id="form-type" onchange="toggleFormFields()" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-royal-600 focus:outline-none">
                        <option value="directory">Local Directory (Shop / Doctor / Service)</option>
                        <option value="marketplace">Marketplace Classified (Buy / Sell Item)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Title / Name *</label>
                    <input type="text" id="form-title" required placeholder="e.g., Al-Saj Fresh Chicken Stall / Naadan Banana Bunches" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-royal-600 focus:outline-none">
                </div>

                <div id="field-category-wrapper">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Category *</label>
                    <select id="form-category" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-royal-600 focus:outline-none">
                        <!-- Populated dynamically based on type -->
                    </select>
                </div>

                <div id="field-price-wrapper" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Price (₹) *</label>
                    <input type="number" id="form-price" placeholder="e.g., 350" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-royal-600 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Contact Phone Number *</label>
                    <input type="tel" id="form-phone" required placeholder="e.g., 9847012345" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-royal-600 focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Description / Details *</label>
                    <textarea id="form-desc" rows="3" required placeholder="Mention open hours, condition, location details..." class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-royal-600 focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Photo Upload (Simulation)</label>
                    <select id="form-photo" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-royal-600 focus:outline-none">
                        <option value="https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80">Fresh Produce / Food</option>
                        <option value="https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=600&auto=format&fit=crop&q=80">Clinic / Medical</option>
                        <option value="https://images.unsplash.com/photo-1578916171728-46686eac8d58?w=600&auto=format&fit=crop&q=80">Bakery / Snacks</option>
                        <option value="https://images.unsplash.com/photo-1556911220-e15b29be8c8f?w=600&auto=format&fit=crop&q=80">Hardware / Appliance</option>
                        <option value="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=600&auto=format&fit=crop&q=80">General Shop / Goods</option>
                    </select>
                </div>

                <div class="pt-3 flex justify-end space-x-3">
                    <button type="button" onclick="closeAddModal()" class="px-5 py-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-100 text-sm font-medium transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium shadow-md transition">Save Listing</button>
                </div>
            </form>
        </div>
    </div>

    <!-- CUSTOM NOTIFICATION MODAL (In lieu of alert()) -->
    <div id="message-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center space-y-4 border border-slate-100">
            <div id="msg-icon" class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl">
                <i class="fa-solid fa-check"></i>
            </div>
            <h4 id="msg-title" class="text-lg font-bold text-slate-800">Success</h4>
            <p id="msg-body" class="text-sm text-slate-600">Action completed successfully.</p>
            <button onclick="closeMessageModal()" class="w-full py-2.5 bg-royal-900 hover:bg-royal-800 text-white rounded-xl text-sm font-medium transition">OK</button>
        </div>
    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Initial Default Data
        const defaultDirectory = [
            {
                id: 'dir-1',
                title: 'Al-Madina Fresh Chicken & Beef Stall',
                category: 'Shop',
                phone: '+919847112233',
                description: 'Halal fresh broiler chicken, country chicken (Nadan Kozhi), and fresh beef available daily. Free home delivery for orders above 2kg.',
                image: 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600&auto=format&fit=crop&q=80'
            },
            {
                id: 'dir-2',
                title: 'Dr. K. Muhammed MBBS, General Practitioner',
                category: 'Doctor',
                phone: '+919447223344',
                description: 'Clinic hours: 9:00 AM - 1:00 PM and 4:00 PM - 8:00 PM. Consultation for general ailments, diabetes management, and pediatric checkups.',
                image: 'https://images.unsplash.com/photo-1584438784894-089d6a62b8fa?w=600&auto=format&fit=crop&q=80'
            },
            {
                id: 'dir-3',
                title: 'Janatha Seva Hospital & Pharmacy',
                category: 'Hospital',
                phone: '+914952701122',
                description: '24/7 Emergency care, ambulance service, clinical laboratory, and 24-hour medical store attached.',
                image: 'https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?w=600&auto=format&fit=crop&q=80'
            },
            {
                id: 'dir-4',
                title: 'Shameer Electrician & Home Wiring',
                category: 'Service',
                phone: '+919946334455',
                description: 'Expert home electrical wiring, inverter installation, solar panel servicing, and emergency repair works in the locality.',
                image: 'https://images.unsplash.com/photo-1621905251189-08b45d6a269e?w=600&auto=format&fit=crop&q=80'
            }
        ];

        const defaultMarketplace = [
            {
                id: 'mkt-1',
                title: 'Nadan Nendran Banana Bunches (Ethappazham)',
                category: 'Livestock & Food',
                price: 320,
                phone: '+919847556677',
                description: 'Organic raw Nendran banana bunches harvested from home garden. 3 bunches available. Best quality for making chips or ripening.',
                image: 'https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=600&auto=format&fit=crop&q=80'
            },
            {
                id: 'mkt-2',
                title: 'Nadan Kozhi (Country Chickens for Sale)',
                category: 'Livestock & Food',
                price: 650,
                phone: '+919747889900',
                description: 'Healthy homegrown Nadan chickens raised on natural grains. Weight around 1.5kg to 2kg each. 5 birds available.',
                image: 'https://images.unsplash.com/photo-1548550023-2bdb3c5beed7?w=600&auto=format&fit=crop&q=80'
            },
            {
                id: 'mkt-3',
                title: 'Semi-Automatic Washing Machine (LG 7kg)',
                category: 'Appliances',
                price: 4500,
                phone: '+919633221144',
                description: '1.5 years old LG semi-automatic washing machine in excellent working condition. Upgrading to fully automatic.',
                image: 'https://images.unsplash.com/photo-1626806787461-102c1bfaaea1?w=600&auto=format&fit=crop&q=80'
            }
        ];

        // State Management
        let directoryList = JSON.parse(localStorage.getItem('naattu_directory')) || defaultDirectory;
        let marketplaceList = JSON.parse(localStorage.getItem('naattu_marketplace')) || defaultMarketplace;
        
        let currentDirFilter = 'all';
        let currentMarketFilter = 'all';

        // Initialization
        window.onload = function() {
            renderDirectory(directoryList);
            renderMarketplace(marketplaceList);
            toggleFormFields();
        };

        // Tab Switching
        function switchTab(tab) {
            const dirSec = document.getElementById('section-directory');
            const mktSec = document.getElementById('section-marketplace');
            const btnDir = document.getElementById('btn-directory');
            const btnMkt = document.getElementById('btn-marketplace');

            if (tab === 'directory') {
                dirSec.classList.remove('hidden');
                mktSec.classList.add('hidden');
                btnDir.className = "py-3 px-4 text-sm font-semibold border-b-2 border-emerald-400 text-white flex items-center space-x-2 transition";
                btnMkt.className = "py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-300 hover:text-white flex items-center space-x-2 transition";
            } else {
                dirSec.classList.add('hidden');
                mktSec.classList.remove('hidden');
                btnMkt.className = "py-3 px-4 text-sm font-semibold border-b-2 border-emerald-400 text-white flex items-center space-x-2 transition";
                btnDir.className = "py-3 px-4 text-sm font-semibold border-b-2 border-transparent text-slate-300 hover:text-white flex items-center space-x-2 transition";
            }
        }

        // Render Directory
        function renderDirectory(items) {
            const grid = document.getElementById('directory-grid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">No directory listings found.</div>`;
                return;
            }
            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="h-44 w-full bg-slate-100 relative overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/1e3a8a/ffffff?text=Naattukootam'">
                            <span class="absolute top-3 right-3 bg-royal-900/80 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-medium shadow">${item.category}</span>
                        </div>
                        <div class="p-5 space-y-2">
                            <h3 class="font-bold text-slate-800 text-base line-clamp-1">${item.title}</h3>
                            <p class="text-xs text-slate-600 line-clamp-3 leading-relaxed">${item.description}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center gap-2">
                        <a href="tel:${item.phone}" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white text-center py-2.5 rounded-xl text-xs font-semibold shadow-sm transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-phone"></i>
                            <span>Call ${item.phone}</span>
                        </a>
                        <a href="https://wa.me/${item.phone.replace(/[^0-9]/g, '')}?text=Hello,%20I%20found%20your%20listing%20on%20Naattukootam" target="_blank" class="w-10 h-10 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center transition" title="Chat on WhatsApp">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Render Marketplace
        function renderMarketplace(items) {
            const grid = document.getElementById('marketplace-grid');
            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">No marketplace items found.</div>`;
                return;
            }
            grid.innerHTML = items.map(item => `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="h-44 w-full bg-slate-100 relative overflow-hidden">
                            <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/047857/ffffff?text=Marketplace'">
                            <span class="absolute top-3 right-3 bg-emerald-700/90 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-medium shadow">${item.category}</span>
                            <div class="absolute bottom-3 left-3 bg-white/95 backdrop-blur-sm text-emerald-700 font-bold text-sm px-3 py-1 rounded-xl shadow">
                                ₹${item.price}
                            </div>
                        </div>
                        <div class="p-5 space-y-2">
                            <h3 class="font-bold text-slate-800 text-base line-clamp-1">${item.title}</h3>
                            <p class="text-xs text-slate-600 line-clamp-3 leading-relaxed">${item.description}</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex items-center gap-2">
                        <a href="tel:${item.phone}" class="flex-1 bg-royal-900 hover:bg-royal-800 text-white text-center py-2.5 rounded-xl text-xs font-semibold shadow-sm transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-phone"></i>
                            <span>Contact Seller</span>
                        </a>
                        <a href="https://wa.me/${item.phone.replace(/[^0-9]/g, '')}?text=Hi,%20is%20this%20item%20still%20available%20on%20Naattukootam:%20${encodeURIComponent(item.title)}" target="_blank" class="w-10 h-10 bg-emerald-50 hover:bg-emerald-100 text-emerald-600 rounded-xl flex items-center justify-center transition" title="WhatsApp Inquiry">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        // Filtering Directory
        function filterDirCategory(cat) {
            currentDirFilter = cat;
            document.querySelectorAll('.dir-cat-btn').forEach(btn => {
                btn.className = "dir-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition";
            });
            document.getElementById(`dir-cat-${cat}`).className = "dir-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-royal-900 text-white whitespace-nowrap transition";
            filterDirectory();
        }

        function filterDirectory() {
            const query = document.getElementById('directory-search').value.toLowerCase();
            const filtered = directoryList.filter(item => {
                const matchesCat = currentDirFilter === 'all' || item.category === currentDirFilter;
                const matchesQuery = item.title.toLowerCase().includes(query) || item.description.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });
            renderDirectory(filtered);
        }

        // Filtering Marketplace
        function filterMarketCategory(cat) {
            currentMarketFilter = cat;
            document.querySelectorAll('.market-cat-btn').forEach(btn => {
                btn.className = "market-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 whitespace-nowrap transition";
            });
            const catId = cat === 'all' ? 'all' : cat.split(' ')[0];
            document.getElementById(`market-cat-${catId}`).className = "market-cat-btn px-3.5 py-1.5 rounded-xl text-xs font-medium bg-emerald-700 text-white whitespace-nowrap transition";
            filterMarketplace();
        }

        function filterMarketplace() {
            const query = document.getElementById('market-search').value.toLowerCase();
            const filtered = marketplaceList.filter(item => {
                const matchesCat = currentMarketFilter === 'all' || item.category === currentMarketFilter;
                const matchesQuery = item.title.toLowerCase().includes(query) || item.description.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });
            renderMarketplace(filtered);
        }

        // Modal Controls
        function openAddModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            toggleFormFields();
        }

        function closeAddModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('add-form').reset();
        }

        function toggleFormFields() {
            const type = document.getElementById('form-type').value;
            const catSelect = document.getElementById('form-category');
            const priceWrapper = document.getElementById('field-price-wrapper');
            const priceInput = document.getElementById('form-price');

            catSelect.innerHTML = '';
            if (type === 'directory') {
                priceWrapper.classList.add('hidden');
                priceInput.removeAttribute('required');
                ['Shop', 'Doctor', 'Hospital', 'Service'].forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    catSelect.appendChild(opt);
                });
            } else {
                priceWrapper.classList.remove('hidden');
                priceInput.setAttribute('required', 'true');
                ['Livestock & Food', 'Appliances', 'Vehicles', 'Others'].forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c;
                    opt.textContent = c;
                    catSelect.appendChild(opt);
                });
            }
        }

        // Form Submission
        function handleFormSubmit(e) {
            e.preventDefault();
            const type = document.getElementById('form-type').value;
            const newItem = {
                id: 'item-' + Date.now(),
                title: document.getElementById('form-title').value,
                category: document.getElementById('form-category').value,
                phone: document.getElementById('form-phone').value,
                description: document.getElementById('form-desc').value,
                image: document.getElementById('form-photo').value
            };

            if (type === 'marketplace') {
                newItem.price = parseFloat(document.getElementById('form-price').value) || 0;
                marketplaceList.unshift(newItem);
                localStorage.setItem('naattu_marketplace', JSON.stringify(marketplaceList));
                renderMarketplace(marketplaceList);
                switchTab('marketplace');
            } else {
                directoryList.unshift(newItem);
                localStorage.setItem('naattu_directory', JSON.stringify(directoryList));
                renderDirectory(directoryList);
                switchTab('directory');
            }

            closeAddModal();
            showCustomMessage('Success!', 'Your listing has been added successfully.', 'success');
        }

        // Custom Message Box
        function showCustomMessage(title, body, type = 'success') {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-body').textContent = body;
            const iconDiv = document.getElementById('msg-icon');
            if (type === 'success') {
                iconDiv.className = "w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-xl";
                iconDiv.innerHTML = '<i class="fa-solid fa-check"></i>';
            }
            document.getElementById('message-modal').classList.remove('hidden');
        }

        function closeMessageModal() {
            document.getElementById('message-modal').classList.add('hidden');
        }
    </script>
</body>
</html>
