<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>നാട്ടൂട്ടം (Naattukoottam) - Local Directory & Marketplace</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a', // Deep Royal Blue
                        secondary: '#047857', // Emerald Green
                        accent: '#dc2626' // Coral Red
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header -->
    <header class="bg-primary text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-secondary p-2 rounded-lg text-white">
                    <i class="fa-solid fa-store text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">നാട്ടൂട്ടം (Naattukoottam)</h1>
                    <p class="text-xs text-slate-300">Local Directory & Marketplace</p>
                </div>
            </div>
            <button onclick="openModal()" class="bg-secondary hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow transition flex items-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>+ Add Listing</span>
            </button>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="bg-blue-900 text-white shadow-inner">
        <div class="max-w-7xl mx-auto px-4 flex space-x-6">
            <button onclick="switchTab('directory')" id="tab-directory" class="py-3 border-b-2 border-emerald-400 font-medium text-sm flex items-center space-x-2 transition">
                <i class="fa-solid fa-address-book"></i>
                <span>Local Directory</span>
            </button>
            <button onclick="switchTab('marketplace')" id="tab-marketplace" class="py-3 border-b-2 border-transparent text-slate-300 hover:text-white font-medium text-sm flex items-center space-x-2 transition">
                <i class="fa-solid fa-basket-shopping"></i>
                <span>Marketplace / Classifieds</span>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6">
        
        <!-- Search & Filter Bar -->
        <div class="mb-6 flex flex-col md:flex-row gap-4 items-center justify-between">
            <div class="relative w-full md:w-96">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterItems()" placeholder="Search shops, doctors, items..." class="w-full pl-10 pr-4 py-2 bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary text-sm shadow-sm">
            </div>
            
            <div id="categoryFilters" class="flex flex-wrap gap-2 w-full md:w-auto">
                <button onclick="filterCategory('All')" class="cat-btn bg-primary text-white px-3 py-1.5 rounded-full text-xs font-medium shadow transition">All</button>
                <button onclick="filterCategory('Shops')" class="cat-btn bg-white text-slate-700 border border-slate-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100 transition">Shops</button>
                <button onclick="filterCategory('Doctors')" class="cat-btn bg-white text-slate-700 border border-slate-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100 transition">Doctors</button>
                <button onclick="filterCategory('Hospitals')" class="cat-btn bg-white text-slate-700 border border-slate-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100 transition">Hospitals</button>
                <button onclick="filterCategory('Services')" class="cat-btn bg-white text-slate-700 border border-slate-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100 transition">Services</button>
            </div>
        </div>

        <!-- Cards Grid Container -->
        <div id="itemsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards will load here -->
        </div>
    </main>

    <!-- Add Item Modal -->
    <div id="itemModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-lg w-full p-6 shadow-2xl relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            <h2 class="text-xl font-bold text-primary mb-4">Add New Listing / Item</h2>
            
            <form id="listingForm" onsubmit="saveItem(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Section</label>
                    <select id="itemSection" onchange="toggleFormFields()" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                        <option value="directory">Local Directory (Shops, Doctors, etc.)</option>
                        <option value="marketplace">Marketplace / Classifieds (Sell Items)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Title / Name</label>
                    <input type="text" id="itemTitle" required placeholder="e.g. Al-Madina Fresh Chicken / Nadan Kozhi" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>

                <div id="categoryFieldContainer">
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Category</label>
                    <select id="itemCategory" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                        <option value="Shops">Shops</option>
                        <option value="Doctors">Doctors</option>
                        <option value="Hospitals">Hospitals</option>
                        <option value="Services">Services</option>
                    </select>
                </div>

                <div id="priceFieldContainer" class="hidden">
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Price (₹)</label>
                    <input type="text" id="itemPrice" placeholder="e.g. ₹350 /kg" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Phone Number</label>
                    <input type="tel" id="itemPhone" required placeholder="e.g. 9847112233" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Description / Details</label>
                    <textarea id="itemDesc" rows="3" required placeholder="Provide full details here..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-600 mb-1">Image URL (Optional)</label>
                    <input type="url" id="itemImage" placeholder="Paste image link or leave blank" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-primary focus:outline-none">
                </div>

                <div class="flex justify-end space-x-3 pt-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-sm font-medium text-slate-700 hover:bg-slate-100">Cancel</button>
                    <button type="submit" class="px-5 py-2 bg-secondary text-white rounded-lg text-sm font-medium hover:bg-emerald-700 shadow">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-primary text-white py-4 mt-auto text-center text-xs text-slate-300">
        <p>നാട്ടൂട്ടം (Naattukoottam) • Powered by Firebase Firestore</p>
    </footer>

    <!-- Firebase SDKs (Compat version for smooth HTML integration) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        // താങ്കൾ നൽകിയ ഫയർബേസ് കോൺഫിഗറേഷൻ വിവരങ്ങൾ ഇവിടെ ചേർത്തിരിക്കുന്നു:
        const firebaseConfig = {
            apiKey: "AIzaSyBVOaetjVqePS-v_JbSB6D2ZyeBQdJcibQ",
            authDomain: "nattukoottam-ec467.firebaseapp.com",
            projectId: "nattukoottam-ec467",
            storageBucket: "nattukoottam-ec467.firebasestorage.app",
            messagingSenderId: "412961092217",
            appId: "1:412961092217:web:e874a622f6cdd974d39aa8",
            measurementId: "G-HCWEJDGJ31"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentTab = 'directory';
        let currentCategory = 'All';
        let allItems = [];

        // Firebase-ൽ നിന്ന് ഡാറ്റ തത്സമയം എടുക്കാൻ (Real-time Sync)
        function loadData() {
            db.collection("listings").onSnapshot((snapshot) => {
                allItems = [];
                snapshot.forEach((doc) => {
                    allItems.push({ id: doc.id, ...doc.data() });
                });
                renderItems();
            }, (error) => {
                console.error("Error loading data: ", error);
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            const dirBtn = document.getElementById('tab-directory');
            const mktBtn = document.getElementById('tab-marketplace');
            const catFilters = document.getElementById('categoryFilters');

            if(tab === 'directory') {
                dirBtn.className = "py-3 border-b-2 border-emerald-400 font-medium text-sm flex items-center space-x-2 transition";
                mktBtn.className = "py-3 border-b-2 border-transparent text-slate-300 hover:text-white font-medium text-sm flex items-center space-x-2 transition";
                catFilters.style.display = 'flex';
            } else {
                mktBtn.className = "py-3 border-b-2 border-emerald-400 font-medium text-sm flex items-center space-x-2 transition";
                dirBtn.className = "py-3 border-b-2 border-transparent text-slate-300 hover:text-white font-medium text-sm flex items-center space-x-2 transition";
                catFilters.style.display = 'none';
            }
            renderItems();
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                if(btn.innerText === cat) {
                    btn.className = "cat-btn bg-primary text-white px-3 py-1.5 rounded-full text-xs font-medium shadow transition";
                } else {
                    btn.className = "cat-btn bg-white text-slate-700 border border-slate-300 px-3 py-1.5 rounded-full text-xs font-medium hover:bg-slate-100 transition";
                }
            });
            renderItems();
        }

        function renderItems() {
            const grid = document.getElementById('itemsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allItems.filter(item => {
                const matchesTab = item.section === currentTab;
                const matchesSearch = item.title.toLowerCase().includes(searchVal) || item.desc.toLowerCase().includes(searchVal);
                const matchesCat = (currentTab === 'marketplace' || currentCategory === 'All' || item.category === currentCategory);
                return matchesTab && matchesSearch && matchesCat;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400"><i class="fa-solid fa-box-open text-4xl mb-2"></i><p>No items found.</p></div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => `
                <div class="bg-white rounded-xl shadow-md overflow-hidden border border-slate-200 flex flex-col justify-between hover:shadow-lg transition">
                    <div>
                        <div class="h-40 bg-slate-200 relative overflow-hidden">
                            <img src="${item.image || 'https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=600&q=80'}" alt="${item.title}" class="w-full h-full object-cover">
                            <span class="absolute top-2 right-2 bg-slate-900/70 text-white text-xs px-2.5 py-1 rounded-full backdrop-blur-sm font-medium">
                                ${item.section === 'directory' ? item.category : 'Marketplace'}
                            </span>
                            ${item.price ? `<span class="absolute bottom-2 left-2 bg-secondary text-white text-xs px-2.5 py-1 rounded-md font-bold shadow">${item.price}</span>` : ''}
                        </div>
                        <div class="p-4">
                            <h3 class="font-bold text-slate-800 text-lg mb-1">${item.title}</h3>
                            <p class="text-slate-600 text-sm line-clamp-3">${item.desc}</p>
                        </div>
                    </div>
                    <div class="p-4 pt-0 flex gap-2">
                        <a href="tel:${item.phone}" class="flex-1 bg-secondary hover:bg-emerald-700 text-white text-center py-2 rounded-lg text-sm font-medium transition flex items-center justify-center space-x-1.5 shadow-sm">
                            <i class="fa-solid fa-phone"></i>
                            <span>Call</span>
                        </a>
                        <a href="https://wa.me/91${item.phone}?text=Hello,%20I%20saw%20your%20listing%20on%20Naattukoottam:%20${encodeURIComponent(item.title)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm transition flex items-center justify-center shadow-sm">
                            <i class="fa-brands fa-whatsapp text-lg"></i>
                        </a>
                    </div>
                </div>
            `).join('');
        }

        function filterItems() {
            renderItems();
        }

        function openModal() {
            document.getElementById('itemModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('itemModal').classList.add('hidden');
            document.getElementById('listingForm').reset();
            toggleFormFields();
        }

        function toggleFormFields() {
            const section = document.getElementById('itemSection').value;
            const catContainer = document.getElementById('categoryFieldContainer');
            const priceContainer = document.getElementById('priceFieldContainer');

            if(section === 'marketplace') {
                catContainer.classList.add('hidden');
                priceContainer.classList.remove('hidden');
            } else {
                catContainer.classList.remove('hidden');
                priceContainer.classList.add('hidden');
            }
        }

        function saveItem(e) {
            e.preventDefault();
            const section = document.getElementById('itemSection-section') ? document.getElementById('itemSection-section').value : document.getElementById('itemSection').value;
            const title = document.getElementById('itemTitle').value;
            const category = section === 'directory' ? document.getElementById('itemCategory').value : 'Marketplace';
            const price = section === 'marketplace' ? document.getElementById('itemPrice').value : '';
            const phone = document.getElementById('itemPhone').value;
            const desc = document.getElementById('itemDesc').value;
            const image = document.getElementById('itemImage').value;

            const newItem = {
                section: section,
                title: title,
                category: category,
                price: price,
                phone: phone,
                desc: desc,
                image: image,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            db.collection("listings").add(newItem).then(() => {
                closeModal();
            }).catch((error) => {
                alert("Error adding item: " + error.message);
            });
        }

        // പേജ് ലോഡ് ചെയ്യുമ്പോൾ ഡാറ്റ ഫെച്ച് ചെയ്യാൻ
        window.onload = loadData;
    </script>
</body>
</html>
